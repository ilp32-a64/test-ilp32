name: CI probe

# Manual only: measures what the GitHub-hosted runners offer for OpenWrt
# ILP32 builds and QEMU tests. Changes nothing in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: System
        run: |
          uname -a
          cat /etc/os-release | head -4
          nproc
          free -h
          lscpu | head -20

      - name: CPU features (arm64)
        if: runner.arch == 'ARM64'
        run: grep -m1 Features /proc/cpuinfo

      - name: Disk before cleanup
        run: df -h / /mnt 2>/dev/null || df -h /

      - name: Disk after cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / /mnt 2>/dev/null || df -h /

      - name: KVM
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm"
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | \
              sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          fi

      - name: QEMU accelerators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm > /dev/null
          qemu-system-aarch64 --version | head -1
          qemu-system-aarch64 -accel help
          if [ "${{ runner.arch }}" = ARM64 ] && [ -e /dev/kvm ]; then
            # No kernel: only checks that KVM can be opened for an AArch64 guest.
            timeout 10 qemu-system-aarch64 -M virt -cpu host -accel kvm \
              -display none -monitor none -serial none -S &
            sleep 5
            if kill -0 $! 2>/dev/null; then echo "KVM guest started"; kill $!; \
            else echo "KVM guest failed"; fi
          fi
